<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Los Museos: la defensa del quincho</title>
<meta name="description" content="Las fisuras del barrio vienen por las piezas. Poné a los amigos en la vereda y que no entren.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0E1014">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&display=swap">
<style>
  :root{
    --bg:#0E1014; --panel:#171A21; --panel2:#1F232C; --sunk:#0A0C10; --line:#2A2F3A; --hair:#39404E;
    --ink:#F2F1ED; --body:#C8CBD3; --dim:#8B909C;
    --brass:#D9A94F; --alarm:#E86B5E; --patina:#7FB6A4; --aura:#A98CF0;
    --vereda:#2A2E39; --vereda2:#232732; --pasto:#2F4A3A; --camino:#3C4150; --camino2:#4A5062;
  }
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
    --bg:#EFEAE0; --panel:#FFFDF8; --panel2:#F3EEE3; --sunk:#E4DED0; --line:#D9D2C3; --hair:#C9C2B2;
    --ink:#1B1A17; --body:#3C3A34; --dim:#7A766C;
    --brass:#A77A1E; --alarm:#C9483B; --patina:#3E8C77; --aura:#6E4FD1;
    --vereda:#D9D2C2; --vereda2:#CFC7B5; --pasto:#9DBF8E; --camino:#B9B1A0; --camino2:#A79F8E; } }
  :root[data-theme="light"]{
    --bg:#EFEAE0; --panel:#FFFDF8; --panel2:#F3EEE3; --sunk:#E4DED0; --line:#D9D2C3; --hair:#C9C2B2;
    --ink:#1B1A17; --body:#3C3A34; --dim:#7A766C;
    --brass:#A77A1E; --alarm:#C9483B; --patina:#3E8C77; --aura:#6E4FD1;
    --vereda:#D9D2C2; --vereda2:#CFC7B5; --pasto:#9DBF8E; --camino:#B9B1A0; --camino2:#A79F8E; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--body);
    font:15px/1.35 "Archivo","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  #app{height:100%;display:flex;flex-direction:column;
    padding:max(6px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));gap:6px;max-width:1100px;margin:0 auto}

  /* arriba: piezas, aura, ola */
  header{display:flex;align-items:center;gap:6px;flex:none}
  header b{font:400 15px/1 "Archivo Black","Archivo",sans-serif;color:var(--ink);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  header b .largo{display:none}
  @media (min-width:600px){ header b .largo{display:inline} }
  .dato{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:6px 9px;min-height:44px;font-weight:700;color:var(--ink);white-space:nowrap}
  .dato i{display:inline-block;width:10px;height:10px;border-radius:3px}
  .dato.piezas i{background:var(--brass)} .dato.aura i{background:var(--aura);border-radius:50%} .dato.ola i{background:var(--alarm)}
  .dato.late{animation:late .5s ease}
  @keyframes late{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
  header .tema{margin-left:auto;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:16px}

  /* el medio: el mapa y, en la compu, el panel al costado */
  main{flex:1;min-height:0;display:flex;gap:8px}
  #mapa{flex:1;min-height:0;display:grid;place-items:center;position:relative}
  #mapa svg{max-width:100%;max-height:100%;width:100%;height:100%;display:block;touch-action:manipulation;overflow:hidden}
  .puesto{cursor:pointer}
  .puesto .marca{fill:var(--brass);fill-opacity:.0;stroke:var(--brass);stroke-opacity:0;stroke-width:2;stroke-dasharray:4 4;transition:fill-opacity .2s,stroke-opacity .2s}
  svg.eligiendo .puesto.libre .marca{fill-opacity:.18;stroke-opacity:.9}
  svg.eligiendo .puesto.libre{animation:lat 1.2s ease-in-out infinite}
  @keyframes lat{50%{opacity:.55}}
  .torre{cursor:pointer}
  .torre.elegida .aro{stroke-opacity:.8}
  .aro{fill:var(--aura);fill-opacity:.07;stroke:var(--aura);stroke-opacity:0;stroke-width:1.5;stroke-dasharray:5 5;transition:stroke-opacity .2s}
  .torre.molesta{opacity:.5}
  .vida{fill:var(--alarm)} .vidaFondo{fill:#000;fill-opacity:.4} .escudo{fill:var(--patina)}
  .enemigo.golpe{filter:brightness(1.6)}
  .andando{animation:andar .5s ease-in-out infinite alternate;transform-origin:0 0}
  @keyframes andar{from{transform:scale(var(--esc,.25)) rotate(-4deg)}to{transform:scale(var(--esc,.25)) rotate(4deg)}}
  .torre .cuerpo{animation:respirar 2.4s ease-in-out infinite;transform-origin:0 0}
  @keyframes respirar{50%{transform:scale(var(--esc,.3)) translateY(-3px)}}
  .danio{font:700 11px "Archivo Black","Archivo",sans-serif;fill:#FFF;paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round}
  .nube circle{animation:flotar 4s ease-in-out infinite}
  @keyframes flotar{50%{transform:translateY(-4px)}}
  .aviso{font:700 12px "Archivo",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}

  /* abajo: la lista de amigos o la ficha del elegido */
  footer{flex:none;display:flex;flex-direction:column;gap:6px}
  #panelLado{display:none}
  .fila{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
  .fila::-webkit-scrollbar{display:none}
  .amigo{flex:none;width:72px;min-height:88px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 3px;gap:1px;position:relative;overflow:hidden}
  .amigo svg{width:46px;height:46px;flex:none}
  .amigo b{font:700 11px/1 "Archivo",sans-serif;color:var(--ink);max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .amigo small{font-size:11px;color:var(--aura);font-weight:700}
  .amigo.elegido{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset}
  .amigo.puesto,.amigo.caro,.amigo.laburando{opacity:.45}
  .amigo .tag{display:block;width:100%;font:700 9px/1.2 "Archivo",sans-serif;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* la ficha de un amigo: qué tira y cuánto pega, con rayitas para comparar de un vistazo */
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:3px 0 1px}
  .stat{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--dim);font-weight:700}
  .stat .barra{display:flex;gap:2px}
  .stat .barra i{width:9px;height:6px;border-radius:2px;background:var(--line)}
  .stat .barra i.si{background:var(--brass)}
  .stat em{font-style:normal;color:var(--ink)}
  .ficha .hace{color:var(--patina);font-weight:700}
  .acciones{display:flex;gap:6px;flex-wrap:wrap}
  .acciones button,.ola{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:0 14px;font-weight:700;display:flex;align-items:center;gap:6px}
  .acciones button small{color:var(--dim);font-weight:400}
  .acciones .poder{border-color:var(--aura);color:var(--aura)}
  .acciones .vender{margin-left:auto;color:var(--alarm)}
  .ola{background:var(--brass);color:#1A1C22;border-color:transparent;justify-content:center;font:400 16px "Archivo Black","Archivo",sans-serif}
  .ola:disabled{opacity:.45;cursor:default}
  .ficha{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
  .ficha svg{width:44px;height:52px;flex:none}
  .ficha b{color:var(--ink)} .ficha p{margin:0;font-size:12.5px;color:var(--body)}
  .ficha .cerrar{margin-left:auto;min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
  .ayuda{font-size:12px;color:var(--dim);padding:0 2px}

  /* fin de partida y portada: ventana flotante */
  #tapa{position:fixed;inset:0;background:#000A;display:grid;place-items:center;padding:16px;z-index:9}
  #tapa[hidden]{display:none}
  .caja{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:420px;width:100%;box-shadow:0 18px 44px #000A;display:flex;flex-direction:column;gap:10px}
  .caja h1{margin:0;font:400 24px/1.1 "Archivo Black","Archivo",sans-serif;color:var(--ink)}
  .caja p{margin:0}
  .caja .ola{width:100%}
  .mapas{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
  .mapaBtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:52px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);text-align:left}
  .mapaBtn small{color:var(--dim);font-weight:400}
  .mapaBtn i{font-style:normal;color:var(--patina);font-size:12px;font-weight:700}
  .mapaBtn.cerrado{opacity:.45;cursor:default}
  .mapaBtn.ganado{border-color:var(--patina)}
  .salir{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 14px;font-weight:700}

  @media (min-width:900px) and (orientation:landscape){
    main{flex-direction:row}
    #panelLado{display:flex;width:340px;flex:none;justify-content:flex-start}
    #panelAbajo{display:none}
    .fila{flex-wrap:wrap;overflow:visible}
    .amigo{width:78px}
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }
</style>
</head>
<body>
<div id="app">
  <header>
    <b><span class="largo">La defensa del </span>Quincho</b>
    <span class="dato piezas" id="dPiezas"><i></i><span>10</span></span>
    <span class="dato aura" id="dAura"><i></i><span>0</span></span>
    <span class="dato ola" id="dOla"><i></i><span>Ola 0/10</span></span>
    <button class="tema" id="tema" type="button" aria-label="Modo claro u oscuro">◐</button>
  </header>
  <main>
    <div id="mapa"></div>
    <footer id="panelLado"></footer>
  </main>
  <footer id="panelAbajo"></footer>
</div>
<div id="tapa">
  <div class="caja">
    <h1>Los Museos: la defensa del quincho</h1>
  </div>
</div>
<script>
/* =====================================================================
   DATOS DEL JUEGO. Todo lo que es contenido o balance está acá arriba.
   ===================================================================== */
const CREW = {
  tomy  :{n:"Tomy",      hair:"#C2571F", style:"rulos",      beard:false, tall:1.00, shirt:"#4E8FD0"},
  lamber:{n:"Lamber",    hair:"#1E1A18", style:"corto",      beard:true,  tall:1.00, shirt:"#57A06B"},
  chupa :{n:"Chupa",     hair:"#1E1A18", style:"corto",      beard:false, tall:1.00, shirt:"#C9603F"},

/* Cada amigo como torre. rango en px del mapa, cadencia en segundos entre tiros,
   danio por tiro. `efecto` es lo que le pasa al que recibe el tiro. `desde` es
   la ola a partir de la cual se lo puede poner (Chuna llega tarde del laburo). */
const TORRES = {
  tomy:  { rol:"El cebador", tipo:"area", costo:70, rango:95, cadencia:1.4, danio:9, salpica:42,
           efecto:{lento:.5, dura:2}, proyectil:"mate",

           frase:["ni ahí gato","bien ahí gato","tenés razón gato"],
           poder:{n:"Ronda de mate", cuesta:60, pie:"los de cerca se sientan 2,5 s",
                  hace:(e,t)=>{ for(const en of enRango(e,t)) aplicar(en,{quieto:2.5}); } } },
  lamber:{ rol:"El manija", tipo:"lejos", costo:60, rango:110, cadencia:.35, danio:5, proyectil:"notif",
           tira:"Notificaciones, una atrás de otra. Poco daño, no para nunca.",
           frase:["bldo posta","corte na q ver","pfff bldo"],
           poder:{n:"Agenda llena", cuesta:50, pie:"5 s tirando al doble",
                  hace:(e,t)=>{ t.rafaga=5; } } },
  chupa: { rol:"El masajista", tipo:"lejos", costo:80, rango:100, cadencia:1.1, danio:14, proyectil:"masaje",
           efecto:{dormido:1},
           tira:"Masajes. Al que le toca uno se queda dormido un segundo.",
           frase:["Museoss, buen diaa","keee??","ta bie?"],
           poder:{n:"Caja de mudanza", cuesta:70, pie:"los de cerca se frenan 3 s y les duele",
                  hace:(e,t)=>{ for(const en of enRango(e,t)){ aplicar(en,{quieto:3}); herir(e,en,20); } } } },
  kzk:   { rol:"El técnico", tipo:"apoyo", costo:90, rango:95, cadencia:1.0, danio:10, proyectil:"tornillo",
           vecinos:{rango:80, danio:1.25},
           tira:"Tornillos. Los amigos de al lado pegan un 25% más.",
           frase:["jajaja mis diseños dice el chanta","amigo, esto se mejora"],
           poder:{n:"Monopatinazo", cuesta:40, pie:"se muda a otro lugar gratis",
                  hace:(e,t)=>{ e.mudando=t.id; } } },

           tira:"Sobres. El cartero no llama dos veces: un golpe fuerte y seguro.",
           frase:["Quizás, sea... es un montón","flah, amigo"],
           poder:{n:"Seducción", cuesta:65, pie:"los que lo miran se dan vuelta 2 s",

  chuna: { rol:"Recién salido del laburo", tipo:"cerca", costo:85, rango:130, cadencia:1.6, danio:16, proyectil:"audio",
           linea:26, desde:3,
           tira:"Audios de 5 minutos. Le pegan a todos los que están en la línea.",
           frase:["Holis bellos míos, soy yoooo","me están manijeando en el trabajo"],
           poder:{n:"Piernas", cuesta:80, pie:"corre todo el camino pateando a todos",
                  hace:(e,t)=>{ for(const en of e.enemigos) if(!en.muerto) herir(e,en,22); } } },
  hippie:{ rol:"Buena onda", tipo:"area", costo:75, rango:85, cadencia:0, danio:0, nube:{lento:.6},
           tira:"Humo de sahumerio. Los que lo respiran van más lento.",
           frase:["flama","tranqui, está flama"],
           poder:{n:"Buena onda", cuesta:55, pie:"a los de la nube se les borra el escudo",
                  hace:(e,t)=>{ for(const en of enRango(e,t)){ en.escudo=0; herir(e,en,10); } } } },
  marian:{ rol:"Ojo de halcón", tipo:"lejos", costo:110, rango:160, cadencia:1.8, danio:30, proyectil:"reel",
           rebota:.5,
           tira:"Reels. Lejos, fuerte, y el reel rebota a otro.",
           frase:["mal","loco, mal","terrible amigo"],
           poder:{n:"Sin filtro", cuesta:60, pie:"3 reels al triple",
                  hace:(e,t)=>{ t.triple=3; } } },
  damian:{ rol:"El director", tipo:"area", costo:65, rango:90, cadencia:1.2, danio:8, salpica:36,
           efecto:{quieto:.45}, proyectil:"claqueta",
           tira:"Claquetazos. «¡Corte!»: todos los de alrededor se frenan un instante.",
           frase:["vamoo","neh, amix"],
           poder:{n:"Luces calientes", cuesta:55, pie:"los encandila: retroceden",
                  hace:(e,t)=>{ for(const en of enRango(e,t)) aplicar(en,{empuje:70}); } } },
  negro: { rol:"El asador", tipo:"area", costo:95, rango:100, cadencia:1.5, danio:12, salpica:48, proyectil:"chori",
           tira:"Choris de la parrilla. Salpican a todos los de alrededor.",
           frase:["dale macarni","uhh amigo","divino"],
           poder:{n:"Miel de carpincho", cuesta:70, pie:"los de cerca quedan pegados 3 s",

const MEJORA = { niveles:3, danio:1.45, rango:1.08, costo:.6 };   // costo de mejorar = costo base × 0.6 × nivel

/* Las fisuras del barrio. Vienen por la vereda a llevarse las piezas. vel en px/s. */
const ENEMIGOS = {
  manguero:   { n:"El Manguero",     vida:60,  vel:38,  aura:8,  shirt:"#4A5A7A", look:"manguero",
                d:"«¿No tenés una moneda?» Camina y pide." },
  trapito:    { n:"El Trapito",      vida:55,  vel:66,  aura:10, shirt:"#D8A33C", look:"trapito",
                d:"Apurado, con el trapo al hombro. Te cuida el auto aunque no tengas." },
  carrito:    { n:"El del Carrito",  vida:240, vel:24,  aura:22, shirt:"#8A8A8A", look:"carrito",
                d:"Lento, con el carrito cargado hasta arriba. Aguanta todo." },
  perro:      { n:"El Perro de la Esquina", vida:48, vel:105, aura:12, shirt:"#B07A3E", look:"perro", inmune:["lento"],
                d:"Corre a todo lo que se mueve. El humo no lo frena." },
  medias:     { n:"El de las Medias", vida:110, vel:34,  aura:18, shirt:"#5A4A3A", look:"medias", escudo:45,
                d:"«Tres pares por mil.» Las medias lo protegen." },
  vecina:     { n:"La Vecina Chusma", vida:75,  vel:44,  aura:16, shirt:"#C4506B", look:"vecina", molesta:{cada:4, dura:2},
                d:"Se para a charlar y un amigo deja de tirar 2 s." },
  jefe5:      { n:"El Trapito Jefe", vida:650, vel:28, aura:70, shirt:"#3A2A1A", look:"trapito", escudo:120, grande:1.5,
                d:"El que maneja la cuadra. Cobra por estacionar en tu propia casa." },
  lunes:      { n:"El Rey de la Esquina", vida:1800, vel:18, aura:150, shirt:"#1A1C22", look:"rey", grande:1.9,
                inmune:["lento","quieto","reversa","empuje","dormido"],
                d:"Está en el kiosco desde 1998. No se lo frena. Llega igual." },
};

/* Mapas. El camino es una lista de puntos; los puestos son dónde se puede poner a alguien.
   `paleta` pisa los colores del escenario; `deco` dice qué dibuja la vista alrededor.
   `dificultad` multiplica la vida de las fisuras. */
function olas(lista){ return lista.map(o=>o.split(" ")); }
const MAPAS = {
  quincho: {
    n:"La vereda del quincho", sub:"Las fisuras vienen por la cuadra.", ancho:390, alto:560, piezas:10, aura:200, dificultad:1, deco:"barrio",
    paleta:{pasto:"#2F4A3A", camino:"#3C4150", camino2:"#4A5062", vereda2:"#232732"},
    paletaClara:{pasto:"#9DBF8E", camino:"#B9B1A0", camino2:"#A79F8E", vereda2:"#CFC7B5"},
    camino:[[40,-30],[40,80],[300,80],[300,190],[90,190],[90,300],[320,300],[320,410],[140,410],[140,470],[195,540]],
    cartel:[110,13],
    puestos:[[120,46],[200,40],[340,130],[170,135],[40,250],[200,250],[260,250],[40,360],[232,365],[350,360],[60,470],[290,470]],
    olas:olas(["manguero*7","manguero*8 trapito*4","manguero*6 trapito*6 carrito*2","perro*7 manguero*6","jefe5*1 manguero*6 trapito*4",
      "vecina*3 trapito*8 carrito*3","medias*6 perro*6 manguero*4","carrito*5 vecina*4 manguero*8","medias*7 trapito*8 perro*7","lunes*1 medias*4 vecina*3 carrito*3"]),
  },
  playa: {
    n:"La playa", sub:"Vinieron de vacaciones. Las fisuras también.", ancho:390, alto:560, piezas:10, aura:250, dificultad:1.0, deco:"playa",
    paleta:{pasto:"#B89A5E", camino:"#8C7A4E", camino2:"#A08C5C", vereda2:"#9A824E"},
    paletaClara:{pasto:"#F0DCA8", camino:"#D4BC84", camino2:"#E2CC96", vereda2:"#DDC68E"},
    camino:[[-30,60],[120,60],[120,170],[330,170],[330,280],[60,280],[60,400],[300,400],[300,470],[195,540]],

const ORDEN_MAPAS = ["quincho","playa","montania","ciudad","esquina"];

/* =====================================================================

let AZAR = Math.random;
const ARCO = { mate:30, chori:34, sobre:22, claqueta:26, tornillo:18, masaje:14, notif:0, reel:0, audio:0 };
const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]);

function crearPartida(mapaKey){
  const m = MAPAS[mapaKey];
  const largos=[]; let L=0;
  for(let i=1;i<m.camino.length;i++){ L+=dist(m.camino[i-1],m.camino[i]); largos.push(L); }
  return { mapa:mapaKey, piezas:m.piezas, aura:m.aura, ola:0, enOla:false, t:0,
           torres:[], enemigos:[], tiros:[], avisos:[], cola:[], largos, largo:L,
           ids:1, fin:null, mudando:null, matados:0, nuevos:[], efectos:[] };
}
function puntoEnCamino(e, d){
  const c = MAPAS[e.mapa].camino, L = e.largos;
  if(d<=0) return c[0];
  for(let i=0;i<L.length;i++){
    if(d<=L[i]){ const d0 = i?L[i-1]:0, t=(d-d0)/(L[i]-d0); const a=c[i], b=c[i+1];
      return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; }

}
function torreEn(e, puesto){ return e.torres.find(t=>t.puesto===puesto); }
function puedePoner(e, clave, puesto){
  const T=TORRES[clave];
  if(e.fin) return "terminó";
  if(torreEn(e,puesto)) return "ocupado";
  if(e.torres.some(t=>t.clave===clave)) return "ya está";
  if(T.desde && e.ola+1 < T.desde) return "laburando";
  if(e.aura < T.costo) return "aura";
  return null;
}
function poner(e, clave, puesto){
  const por = puedePoner(e,clave,puesto); if(por) return por;
  const T=TORRES[clave], p=MAPAS[e.mapa].puestos[puesto];
  e.aura -= T.costo;
  e.torres.push({ id:e.ids++, clave, puesto, x:p[0], y:p[1], nivel:1, enfriando:0, rafaga:0, triple:0, molesta:0, tiros:0 });

}
function mudar(e, torre, puesto){

}
function costoMejora(t){ return Math.round(TORRES[t.clave].costo*MEJORA.costo*t.nivel); }
function mejorar(e, t){

  e.aura-=c; t.nivel++; return null;
}
function vender(e, t){
  e.aura += Math.round(TORRES[t.clave].costo*.6);

}
function usarPoder(e, t){
  const P=TORRES[t.clave].poder; if(e.aura<P.cuesta) return "aura"; if(e.fin) return "terminó";
  e.aura-=P.cuesta; P.hace(e,t); aviso(e, P.n+"!"); return null;
}
function rangoDe(t){ return TORRES[t.clave].rango * Math.pow(MEJORA.rango, t.nivel-1); }
function danioDe(e,t){
  let d = TORRES[t.clave].danio * Math.pow(MEJORA.danio, t.nivel-1);
  for(const k of e.torres) if(k!==t && TORRES[k.clave].vecinos && dist([k.x,k.y],[t.x,t.y])<=TORRES[k.clave].vecinos.rango) d*=TORRES[k.clave].vecinos.danio;

function enRango(e, t){ const r=rangoDe(t); return e.enemigos.filter(en=>!en.muerto && dist([en.x,en.y],[t.x,t.y])<=r); }
function aplicar(en, ef){
  const E=ENEMIGOS[en.tipo], inm = E.inmune||[];
  for(const k in ef){ if(inm.includes(k)) continue;
    if(k==="lento"){ en.lento=Math.min(en.lento??1, ef.lento); en.lentoT=Math.max(en.lentoT||0, ef.dura||1); }
    else if(k==="dura"){}

function herir(e, en, danio){

function elegir(l){ return l[Math.floor(AZAR()*l.length)]; }
function aviso(e, txt){ e.avisos.push({txt, t:e.t}); if(e.avisos.length>6) e.avisos.shift(); }

function iniciarOla(e){
  if(e.enOla || e.fin) return false;

  if(e.ola>0 && e.enemigos.length===0 && e.colaVacia) e.aura+=REGLAS.bonoApuro;  // apurarse paga

    for(let i=0;i<+n;i++){ e.cola.push({tipo, en:t}); t+=REGLAS.separacion; } }
  e.cola.sort((a,b)=>a.en-b.en); e.olaT=0; e.ola++; e.enOla=true; e.colaVacia=false;

function soltar(e, tipo){

function avanzar(e, dt){

  if(e.enOla){ e.olaT+=dt; while(e.cola.length && e.cola[0].en<=e.olaT) soltar(e, e.cola.shift().tipo);
    if(!e.cola.length) e.colaVacia=true; }
  // enemigos
  for(const en of e.enemigos){ if(en.muerto||en.llego) continue;
    const E=ENEMIGOS[en.tipo];
    if(en.golpe>0) en.golpe-=dt;
    let v=en.vel;
    if(en.lentoT>0){ v*=en.lento; en.lentoT-=dt; if(en.lentoT<=0) en.lento=1; }
    // nube del hippie
    for(const t of e.torres){ const N=TORRES[t.clave].nube; if(N && !(E.inmune||[]).includes("lento") && dist([en.x,en.y],[t.x,t.y])<=rangoDe(t)) v*=N.lento; }
    if(en.quieto>0){ en.quieto-=dt; v=0; }
    if(en.dormido>0){ en.dormido-=dt; v=0; }
    if(en.reversa>0){ en.reversa-=dt; v=-v; }
    en.d=Math.max(0, en.d+v*dt);
    const ax=en.x; [en.x,en.y]=puntoEnCamino(e,en.d); if(Math.abs(en.x-ax)>.05) en.dir=en.x>ax?1:-1;
    if(E.molesta){ en.molestaT-=dt; if(en.molestaT<=0){ en.molestaT=E.molesta.cada;
      let mejor=null, md=1e9; for(const t of e.torres){ const dd=dist([t.x,t.y],[en.x,en.y]); if(dd<md){md=dd;mejor=t;} }
      if(mejor && md<140){ mejor.molesta=E.molesta.dura; aviso(e, E.n+" le ofrece algo a "+CREW[mejor.clave].n); } } }
    if(en.d>=e.largo){ en.llego=true; e.piezas-=REGLAS.llegaRoba; aviso(e, E.n+" se llevó una pieza"); }
  }

  for(const t of e.torres){ const T=TORRES[t.clave];
    if(t.molesta>0){ t.molesta-=dt; continue; }
    if(t.rafaga>0) t.rafaga-=dt;

  if(e.enOla && e.colaVacia && !e.enemigos.length){ e.enOla=false; e.aura+=REGLAS.bonoOla;

function impacto(e, s, obj){

/* miembro: línea gruesa con contorno. pts = [[x,y],[x,y],[x,y]] hombro-codo-mano */

/* el pelo tiene parte de atrás (bajo la cara) y parte de adelante */
function pelo(k, c, capa){
  const h = c.hair, e = osc(h,.4), hi = cla(h,.3);
  const rulo = (x,y,r) => `<circle cx="${x}" cy="${y}" r="${r}"/>`;
  const S = `fill="url(#${k}-pelo)" stroke="${e}" stroke-width="1.6"`;
  switch(c.style){
    case "rulos":
      if(capa==="atras") return `<g ${S}>${rulo(-20,-14,8)}${rulo(20,-14,8)}${rulo(-24,-2,6)}${rulo(24,-2,6)}</g>`;
      return `<g ${S}>${rulo(-14,-26,9)}${rulo(0,-31,10)}${rulo(14,-26,9)}${rulo(-23,-18,7)}${rulo(23,-18,7)}${rulo(-7,-22,7)}${rulo(7,-22,7)}</g>
        <g fill="${hi}" opacity=".6">${rulo(-3,-34,2.4)}${rulo(-16,-29,2)}${rulo(12,-29,2)}</g>`;
    case "largorulos":
      if(capa==="atras") return `<g ${S}>${rulo(-24,-12,10)}${rulo(24,-12,10)}${rulo(-28,4,9)}${rulo(28,4,9)}${rulo(-26,20,8)}${rulo(26,20,8)}${rulo(-20,30,7)}${rulo(20,30,7)}</g>`;
      return `<g ${S}>${rulo(-14,-27,10)}${rulo(0,-32,11)}${rulo(14,-27,10)}${rulo(-24,-20,8)}${rulo(24,-20,8)}</g>
        <g fill="${hi}" opacity=".6">${rulo(-3,-35,2.6)}${rulo(-17,-30,2)}${rulo(13,-30,2)}${rulo(-27,8,2)}</g>`;
    case "largo":
      if(capa==="atras") return `<path d="M-24,-20 C-26,10 -26,30 -22,44 L-14,44 L-14,0 L14,0 L14,44 L22,44 C26,30 26,10 24,-20 Z" ${S}/>`;
      return `<path d="M-23,-14 C-23,-36 23,-36 23,-14 L24,-6 C22,-16 16,-22 8,-24 C2,-25 -6,-23 -12,-20 C-18,-17 -22,-12 -24,-6 Z" ${S}/>
        <path d="M-8,-30 q10,-4 18,2" stroke="${hi}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    case "medio":
      if(capa==="atras") return `<path d="M-24,-16 C-26,0 -26,8 -24,14 L-18,14 L-18,-6 L18,-6 L18,14 L24,14 C26,8 26,0 24,-16 Z" ${S}/>`;
      return `<path d="M-23,-14 C-23,-36 23,-36 23,-14 L23,-8 C20,-18 12,-23 4,-22 L-2,-16 L-6,-23 C-14,-22 -20,-16 -23,-8 Z" ${S}/>
        <path d="M-10,-29 q8,-4 16,0" stroke="${hi}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    default: // corto
      if(capa==="atras") return "";
      return `<path d="M-23,-12 C-24,-36 24,-36 23,-12 L22,-9 C20,-18 14,-22 8,-21 L4,-17 L-1,-22 L-6,-18 L-11,-22 C-17,-21 -21,-15 -22,-9 Z" ${S}/>
        <path d="M-10,-28 q8,-4 16,-1" stroke="${hi}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  }
}

/* ---------- el cuerpo entero ---------- */
function torso(k, c, g){
  const s = c.shirt, e = osc(s,.5), tag = c.n.replace(/^El /,"").toUpperCase();
  const ink = lum(s) > 140 ? "#1A1C22" : "#F2F1ED";
  const t = (g.pose && g.pose.torso) || g.torso || {x:0,y:-130,rot:0};
  return `<g transform="translate(${t.x},${t.y}) rotate(${t.rot||0})">
    <path d="M-30,0 C-32,20 -30,40 -26,58 L26,58 C30,40 32,20 30,0 C20,-6 -20,-6 -30,0 Z" fill="url(#${k}-remera)" stroke="${e}" stroke-width="1.8"/>
    <path d="M-12,-3 q12,10 24,0" fill="${osc(s,.3)}" stroke="${e}" stroke-width="1.2"/>
    <path d="M-24,14 q-2,20 2,38" stroke="${osc(s,.18)}" stroke-width="2" fill="none" opacity=".7"/>
    <text x="0" y="36" text-anchor="middle" font-family="Archivo Black,Archivo,sans-serif" font-size="11" fill="${ink}" opacity=".92">${tag}</text>
    <rect x="-26" y="54" width="52" height="7" rx="2" fill="${osc(PANT,.2)}"/>
  </g>`;
}
function cuello(k, c, g){
  const piel = c.skin || PIEL;
  return `<rect x="-8" y="${(g.hy||-160)+18}" width="16" height="16" fill="${osc(piel,.15)}" stroke="${osc(piel,.45)}" stroke-width="1.4"/>`;
}

const POSE_BASE = {
  piernas:[ [[-11,-72],[-13,-38],[-14,-6],-1], [[11,-72],[13,-38],[14,-6],1] ],
  brazos:[ [[-27,-124],[-36,-94],[-32,-66]], [[27,-124],[36,-94],[32,-66]] ],
};

function persona(k, c, g){
  const piel = c.skin || PIEL;
  const P = Object.assign({}, POSE_BASE, g.pose || {});
  const piernas = P.piernas.map(p => pierna(p[0],p[1],p[2], PANT, ZAP, p[3])).join("");
  const brazoI = brazo(...P.brazos[0], c.shirt, piel), brazoD = brazo(...P.brazos[1], c.shirt, piel);
  return `${g.atras||""}${P.brazoIzqAtras ? brazoI : ""}${piernas}${cuello(k,c,g)}${torso(k,c,g)}${P.brazoIzqAtras ? "" : brazoI}${g.medio||""}${brazoD}${cabeza(k,c,g)}${g.adelante||""}`;
}

function alTocarMapa(ev){
  const p = ev.target.closest(".puesto"), t = ev.target.closest(".torre");

function pintar(){
  const svg=$("svg"); if(!svg||!E) return;
  svg.classList.toggle("eligiendo", !!eligiendo || !!E.mudando);
  for(const g of svg.querySelectorAll(".puesto")) g.classList.toggle("libre", !torreEn(E,+g.dataset.i));
  // la nube del hippie
  $("nubes").innerHTML = E.torres.filter(t=>TORRES[t.clave].nube).map(t=>`<g transform="translate(${t.x},${t.y})" class="nube"><circle r="${rangoDe(t)}" fill="#A98CF0" opacity=".10"/><circle r="${rangoDe(t)*.7}" fill="#A98CF0" opacity=".08"/><circle cx="${-rangoDe(t)*.4}" cy="${-rangoDe(t)*.3}" r="${rangoDe(t)*.35}" fill="#A98CF0" opacity=".08"/></g>`).join("");
  // torres
  const gT=$("torres"), vivos=new Set();
  for(const t of E.torres){ vivos.add("t"+t.id);

      g.innerHTML=`<circle class="aro"/><ellipse cy="4" rx="20" ry="6" fill="#000" opacity=".3"/><g class="cuerpo" style="--esc:${ESC_TORRE*CREW[t.clave].tall}" transform="scale(${ESC_TORRE*CREW[t.clave].tall})">${svgTorre(t.clave)}</g><g class="nivel"></g>`; gT.appendChild(g); }
    g.setAttribute("transform",`translate(${t.x},${t.y+8})`);
    g.querySelector(".aro").setAttribute("r", rangoDe(t));
    g.classList.toggle("elegida", torreElegida===t.id); g.classList.toggle("molesta", t.molesta>0);
    g.querySelector(".nivel").innerHTML = Array.from({length:t.nivel-1},(_,i)=>`<path transform="translate(${-6+i*10},-70) scale(.55)" d="M0,-9 l2.6,5.6 6.2,.9 -4.5,4.3 1.1,6.1 -5.4,-2.9 -5.4,2.9 1.1,-6.1 -4.5,-4.3 6.2,-.9 z" fill="var(--brass)"/>`).join("");
  }
  for(const g of [...gT.children]) if(!vivos.has("t"+g.dataset.id)) g.remove();
  // fisuras
  const gF=$("fisuras"), vivosF=new Set();
  for(const en of E.enemigos){ vivosF.add(en.id);
    let g=gF.querySelector(`[data-id="${en.id}"]`); const Ef=ENEMIGOS[en.tipo], esc=ESC_FIS*(Ef.grande||1), alto=48*esc/ESC_FIS;
    if(!g){ g=document.createElementNS("http://www.w3.org/2000/svg","g"); g.setAttribute("class","enemigo"); g.dataset.id=en.id;
      g.innerHTML=`<g class="voltea"><ellipse cy="3" rx="${14*esc/ESC_FIS}" ry="4" fill="#000" opacity=".3"/><g class="cuerpo andando" style="--esc:${esc}" transform="scale(${esc})">${svgFisura(en.tipo)}</g></g><rect class="vidaFondo" x="-14" y="${-alto}" width="28" height="4" rx="2"/><rect class="vida" x="-14" y="${-alto}" width="28" height="4" rx="2"/><rect class="escudo" x="-14" y="${-alto-5}" width="0" height="3" rx="1.5"/><text class="estado" y="${-alto-8}" text-anchor="middle" font-size="12"></text>`;
      gF.appendChild(g); }
    // solo el perro se da vuelta según adónde va: a la gente, si la damos vuelta, se le da vuelta el cartel
    const mira = Ef.look==="perro" ? (en.reversa>0 ? -1 : 1) * (en.dir||1) : 1;
    g.setAttribute("transform",`translate(${en.x},${en.y+6})`);
    g.querySelector(".voltea").setAttribute("transform",`scale(${mira},1)`);
    g.querySelector(".vida").setAttribute("width", 28*Math.max(0,en.vida)/en.vidaMax);
    g.querySelector(".escudo").setAttribute("width", Ef.escudo? 28*en.escudo/Ef.escudo : 0);
    g.classList.toggle("golpe", en.golpe>0);
    const parado = en.quieto>0||en.dormido>0;
    g.querySelector(".cuerpo").classList.toggle("andando", !parado);
    g.querySelector(".estado").textContent = en.dormido>0?"💤":en.quieto>0?"🧉":en.reversa>0?"😍":(en.lentoT>0||en.lento<1)?"🐌":"";
  }
  for(const g of [...gF.children]) if(!vivosF.has(+g.dataset.id)) g.remove();
  // tiros: giran según adónde van
  $("tiros").innerHTML = E.tiros.map(s=>`<g transform="translate(${s.x},${s.y}) rotate(${GIRA[s.tipo]?(s.ang||0)*57.3+ (s.p*720):0})">${PROYECTIL[s.tipo]||""}</g>`).join("");
  // impactos: un círculo que crece y el número de daño que flota
  $("efectos").innerHTML = E.efectos.map(f=>{ const k=(E.t-f.t)/.7; return `<g transform="translate(${f.x},${f.y})"><circle r="${f.r*(.3+.7*k)}" fill="${f.tipo==="salpica"?"#F2B33D":"#F2F1ED"}" opacity="${.45*(1-k)}" stroke="#FFF" stroke-opacity="${.6*(1-k)}" stroke-width="2"/><text y="${-10-26*k}" text-anchor="middle" class="danio" opacity="${1-k}">${f.n}</text></g>`; }).join("");
  const rec=E.avisos.filter(a=>E.t-a.t<3.2).slice(-3);
  $("avisos").innerHTML = rec.map((a,i)=>`<text class="aviso" x="${M.ancho/2}" y="${M.alto-96-i*16}" text-anchor="middle" opacity="${Math.min(1,(3.2-(E.t-a.t))/.8)}">${esc(a.txt)}</text>`).join("");
  $("vitrina").innerHTML = Array.from({length:M.piezas},(_,i)=>`<rect x="${-36+i*9.5}" y="-4" width="7" height="11" rx="1.5" fill="${i<E.piezas?'var(--brass)':'#0006'}"/>`).join("");

const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Ficha de números de un amigo, en rayitas del 1 al 5 (con el número al lado) para comparar sin leer. */
const A_QUIEN = { lejos:"a uno", area:"a varios", cerca:"a la fila", apoyo:"a uno, y ayuda" };
function rayas(n){ n=Math.max(0,Math.min(5,Math.round(n))); return `<span class="barra">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"si":""}"></i>`).join("")}</span>`; }
function fichaStats(k, nivel=1){
  const T=TORRES[k], d=T.danio*Math.pow(MEJORA.danio,nivel-1), r=T.rango*Math.pow(MEJORA.rango,nivel-1);
  const porSeg = T.cadencia ? 1/T.cadencia : 0;
  const quien = T.nube ? "a todos en el humo" : T.rebota ? "a uno y rebota" : A_QUIEN[T.tipo];
  const st = (nom, barras, num) => `<span class="stat">${nom} ${rayas(barras)}<em>${num}</em></span>`;
  return `<div class="stats">`
    + st("Pega", d? Math.max(1,d/38*5) : 0, d? Math.round(d) : "no pega")
    + st("Rapidez", porSeg? Math.max(1,porSeg/2.86*5) : 0, porSeg? (porSeg>=1? porSeg.toFixed(1).replace(".",",")+" por seg" : "1 cada "+T.cadencia.toString().replace(".",",")+" s") : "—")
    + st("Alcance", (r-60)/20, Math.round(r))
    + `<span class="stat">Le pega<em>${quien}</em></span></div>`;
}
function pintarPanel(){

      + (eligiendo ? (()=>{ const T=TORRES[eligiendo], c=CREW[eligiendo], lab=T.desde && E.ola+1<T.desde;
          return `<div class="ficha"><div><b>${c.n}</b> · ${T.rol}<p>${esc(T.tira)}</p>${fichaStats(eligiendo)}<p><span style="color:var(--aura);font-weight:700">${T.poder.n}:</span> ${esc(T.poder.pie).replace(/ s$/,"&nbsp;s")}</p>
            <p class="hace">${lab?"Llega del laburo en la ola "+T.desde+".":E.aura<T.costo?"Te faltan "+Math.ceil(T.costo-E.aura)+" de aura.":"Tocá un lugar libre de la vereda."}</p></div>

      + `<div class="acciones"><button class="ola" type="button" data-acc="ola" ${E.enOla||E.fin?"disabled":""}>${E.ola===0?"Que vengan":E.enOla?"Vienen…":"Que venga la ola "+(E.ola+1)}</button><button type="button" data-acc="mapas" class="salir">Mapas</button></div>`

document.addEventListener("click", ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  if(b.dataset.mapa){ if(abierto(b.dataset.mapa)) empezar(b.dataset.mapa); return; }
  if(b.id==="volverMapas"){ mostrarMapas(); return; }
  if(!E) return;
  if(b.dataset.k){ eligiendo = eligiendo===b.dataset.k?null:b.dataset.k; torreElegida=null; pintarPanel(); pintar(); return; }
  const t = torreElegida!=null ? E.torres.find(x=>x.id===torreElegida) : null;
  switch(b.dataset.acc){
    case "ola": if(iniciarOla(E)) late("dOla"); break;
    case "cerrar": torreElegida=null; break;
    case "soltar": eligiendo=null; break;
    case "poder": if(t){ const por=usarPoder(E,t); if(por) sacudir(por); else late("dAura"); } break;
    case "mejorar": if(t){ const por=mejorar(E,t); if(por) sacudir(por); } break;
    case "vender": if(t){ vender(E,t); torreElegida=null; } break;
    case "mapas": corriendo=false; mostrarMapas(); return;
  }
  pintarPanel(); pintar();
});
$("tema").addEventListener("click", ()=>{ const r=document.documentElement, actual=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); r.dataset.theme=actual==="dark"?"light":"dark"; });

function mostrarMapas(){
  const p=progreso();
  $("tapa").querySelector(".caja").innerHTML = `<h1>Los Museos: la defensa del quincho</h1>
    <p>Las piezas están en el quincho. Las fisuras del barrio vienen por la vereda a llevárselas, de a una. Tocá a un amigo, tocá un lugar, y que no entren.</p>
    <div class="mapas">` + ORDEN_MAPAS.map((k,i)=>{ const m=MAPAS[k], ok=abierto(k);
      return `<button type="button" class="mapaBtn ${ok?"":"cerrado"} ${p[k]?"ganado":""}" data-mapa="${k}" ${ok?"":"disabled"}><b>${i+1}. ${esc(m.n)}</b><small>${ok?esc(m.sub):"Ganá el anterior para abrirlo"}</small>${p[k]?`<i>ganado · ${p[k]} piezas</i>`:""}</button>`; }).join("") + `</div>`;
  $("tapa").hidden=false;
}
function empezar(k){
  mapaActual=k; E=crearPartida(k); armarMapa(); torreElegida=null; eligiendo=null; $("tapa").hidden=true; pintarPanel(); pintar(); corriendo=true;
}
function paso(ts){
  const dt=Math.min(.05, (ts-ultimoT)/1000||0); ultimoT=ts;
  if(corriendo && E && !E.fin){ avanzar(E, dt); pintar();
    if(Math.floor(E.t*2)!==Math.floor((E.t-dt)*2)) pintarPanel();
    if(E.fin) terminar(); }
  requestAnimationFrame(paso);
}
function terminar(){
  corriendo=false; pintar();
  const gano=E.fin==="ganaste";
  if(gano){ const p=progreso(); p[mapaActual]=Math.max(p[mapaActual]||0, E.piezas); guardarProgreso(p); }
  const sig = ORDEN_MAPAS[ORDEN_MAPAS.indexOf(mapaActual)+1];
  $("tapa").querySelector(".caja").innerHTML = `<h1>${gano?"No entró nadie":"Se llevaron todo"}</h1>
    <p>${gano?"Las "+E.piezas+" piezas siguen en el quincho. Maxi sube la foto al álbum de los museo.":"Las fisuras se llevaron las 10 piezas. El barrio es de ellos."}</p>
    <p>${esc(M.n)} · ola ${E.ola} de ${M.olas.length} · ${E.matados} fisuras que no pasaron.</p>
    ${gano&&sig?`<button class="ola" type="button" data-mapa="${sig}">Siguiente: ${esc(MAPAS[sig].n)}</button>`:""}
    <button class="ola" type="button" data-mapa="${mapaActual}">${gano?"Otra vez":"Revancha"}</button>
    <button type="button" class="salir" id="volverMapas">Elegir mapa</button>`;
  $("tapa").hidden=false;
}
mostrarMapas(); requestAnimationFrame(paso);
window.JUEGO = { get E(){return E;}, MOTOR, TORRES, ENEMIGOS, MAPAS, empezar };
</script>
